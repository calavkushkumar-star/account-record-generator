<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account Record Generator</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:28px auto;padding:0 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.panel{background:#fff;border:1px solid #e1e6ef;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #1720330a}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 14px}.muted{color:#64748b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:8px;padding:10px 15px;background:#174ea6;color:white;font-weight:600;cursor:pointer}button.secondary{background:#e8edf5;color:#172033}button.danger{background:#b42318}.hidden{display:none!important}.record{padding:12px;border:1px solid #e1e6ef;border-radius:9px;margin:8px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.record button{padding:7px 10px}.status{font-size:13px;color:#166534;margin-top:10px}.error{color:#b42318}.print-area{display:none}
@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{margin:16px auto}.panel{padding:15px}}
@page{size:A4 landscape;margin:0}
@media print{
 body{background:white}.wrap>*:not(#printArea){display:none!important}#printArea{display:block!important;position:fixed;right:8mm;top:8mm;width:105mm;max-height:190mm;overflow:hidden;font:10pt Arial,sans-serif;color:#111}.print-title{font-size:12pt;font-weight:bold;margin:0 0 8px}.print-row{display:grid;grid-template-columns:38mm 1fr;gap:3mm;padding:3px 0;border-bottom:.25px solid #bbb;overflow-wrap:anywhere}.print-label{font-weight:bold}
}
</style></head>
<body><main class="wrap">
<header class="top"><div><h1>Account Record Generator</h1><div class="muted">Create, save and print your personal account information</div></div><button id="logoutBtn" class="secondary hidden">Logout</button></header>
<section id="authPanel" class="panel"><h2>Login / Create account</h2><div class="grid"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div></div><div class="actions"><button id="loginBtn">Login</button><button id="signupBtn" class="secondary">Create account</button></div><div id="authMsg" class="status"></div></section>
<section id="appPanel" class="hidden">
<div class="panel"><h2>Enter account details</h2><form id="recordForm"><div class="grid">
<div class="field"><label>Account holder name</label><input id="holder" required maxlength="100"></div>
<div class="field"><label>Bank / Institution name</label><input id="bank" maxlength="100"></div>
<div class="field"><label>Account number</label><input id="account" maxlength="40" inputmode="numeric"></div>
<div class="field"><label>IFSC / Routing code</label><input id="ifsc" maxlength="30"></div>
<div class="field"><label>Branch</label><input id="branch" maxlength="100"></div>
<div class="field"><label>Account type</label><select id="type"><option value="">Select</option><option>Savings</option><option>Current</option><option>Other</option></select></div>
<div class="field"><label>Mobile number</label><input id="mobile" maxlength="20" inputmode="tel"></div>
<div class="field"><label>Address</label><input id="address" maxlength="250"></div>
</div><div class="actions"><button type="submit">Save record</button><button type="button" id="clearBtn" class="secondary">Clear form</button></div><div id="saveMsg" class="status"></div><input id="recordId" type="hidden"></form></div>
<div class="panel"><h2>Saved records</h2><div id="records"><div class="muted">No records yet.</div></div></div>
</section><section id="printArea" class="print-area"></section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, getDocs, updateDoc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDqM1axs_592SWfv8g3_FChuU71DN5tFRA",authDomain:"account-record-generator.firebaseapp.com",projectId:"account-record-generator",storageBucket:"account-record-generator.firebasestorage.app",messagingSenderId:"496737397971",appId:"1:496737397971:web:5e95f8a0a77b174d52b826",measurementId:"G-02GLGL864N"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);let currentUser=null,records=[];
const fields=["holder","bank","account","ifsc","branch","type","mobile","address"];
function message(id,text,error=false){$(id).textContent=text;$(id).className=error?"status error":"status"}
function formData(){return Object.fromEntries(fields.map(k=>[k,$(k).value.trim()]));}
function fillForm(r={},id=""){fields.forEach(k=>$(k).value=r[k]||"");$("recordId").value=id;}
async function loadRecords(){const q=query(collection(db,"users",currentUser.uid,"records"),orderBy("createdAt","desc"));const snap=await getDocs(q);records=snap.docs.map(d=>({id:d.id,...d.data()}));renderRecords();}
function renderRecords(){const root=$("records");root.replaceChildren();if(!records.length){root.textContent="No records yet.";root.className="muted";return;}root.className="";records.forEach(r=>{const row=document.createElement("div");row.className="record";const info=document.createElement("div");const strong=document.createElement("strong");strong.textContent=r.holder||"Untitled record";const small=document.createElement("div");small.className="muted";small.textContent=[r.bank,r.branch].filter(Boolean).join(" · ");info.append(strong,small);const actions=document.createElement("div");const edit=document.createElement("button");edit.className="secondary";edit.textContent="Edit";edit.onclick=()=>fillForm(r,r.id);const print=document.createElement("button");print.textContent="Print";print.onclick=()=>printRecord(r);const del=document.createElement("button");del.className="danger";del.textContent="Delete";del.onclick=async()=>{if(confirm("Delete this record?")){await deleteDoc(doc(db,"users",currentUser.uid,"records",r.id));await loadRecords();}};actions.append(edit,print,del);row.append(info,actions);root.append(row);});}
$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value,$("password").value);message("authMsg","");}catch(e){message("authMsg",e.message,true);}};
$("signupBtn").onclick=async()=>{try{await createUserWithEmailAndPassword(auth,$("email").value,$("password").value);message("authMsg","Account created.");}catch(e){message("authMsg",e.message,true);}};
$("logoutBtn").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{currentUser=user;$("authPanel").classList.toggle("hidden",!!user);$("appPanel").classList.toggle("hidden",!user);$("logoutBtn").classList.toggle("hidden",!user);if(user){try{await loadRecords();}catch(e){message("saveMsg","Could not load records. Check Firestore rules and database setup.",true);}}});
$("recordForm").onsubmit=async e=>{e.preventDefault();if(!currentUser)return;const data=formData();try{const id=$("recordId").value;if(id)await updateDoc(doc(db,"users",currentUser.uid,"records",id),data);else await addDoc(collection(db,"users",currentUser.uid,"records"),{...data,createdAt:serverTimestamp()});fillForm();message("saveMsg","Record saved.");await loadRecords();}catch(err){message("saveMsg",err.message,true);}};
$("clearBtn").onclick=()=>{fillForm();message("saveMsg","");};
function printRecord(r){const area=$("printArea");area.replaceChildren();const title=document.createElement("div");title.className="print-title";title.textContent="Account Information";area.append(title);const labels={holder:"Account holder",bank:"Bank / Institution",account:"Account number",ifsc:"IFSC / Code",branch:"Branch",type:"Account type",mobile:"Mobile",address:"Address"};fields.forEach(k=>{if(!r[k])return;const line=document.createElement("div");line.className="print-row";const l=document.createElement("div");l.className="print-label";l.textContent=labels[k];const v=document.createElement("div");v.textContent=r[k];line.append(l,v);area.append(line);});window.print();}
</script></body></html>
